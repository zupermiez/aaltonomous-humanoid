# Aaltonomous scene geometry -- single source of truth for sim (WP3), real resets (layout cards),
# the success checker / scoring (WP4), the safety workspace box and the printed parts.
# Values marked (default) are placeholders until the physical counter is measured (M3);
# change them HERE only, then re-run `python -m aaltonomous.scene.export` for meshes + mat.
#
# Frames
#   pelvis: robot pelvis link (fixed base in sim). x forward, y left, z up. Metres.
#   mat:    printed counter mat. Origin = mat corner on the robot's RIGHT, at the edge NEAREST the robot.
#           x runs along that edge towards the robot's LEFT, y runs AWAY from the robot, z up (on the mat).
#           Layout cards and the printed grid use mat coordinates (cm).
#   p_pelvis = mat_origin_in_pelvis + (y_mat, x_mat, z_mat)     (pure translation + 90 deg yaw)

version: 1

counter:
  # v1 layout (2026-11-10, from teleop on the real robot): table top 80 cm above the floor; the arms reach
  # ~40 cm radially from the waist (torso) joint comfortably and ~55 cm with the arm straight (max).
  # Waist joint = pelvis origin (URDF). Objects are kept within r <= 0.40 m; bins: see bins below.
  # z: surface = 0.80 m - pelvis height; pelvis assumed 0.79 m above floor (G1 standing) -> +0.01. (default) measure.
  mat_origin_in_pelvis: [0.14, -0.45, 0.01]    # mat near edge 14 cm in front of pelvis, mat centred
  mat_size: [0.90, 0.50]                      # x (width along robot), y (depth away from robot); box row far edge at 0.47
  counter_size: [1.10, 0.60]                  # physical table top, centred on the mat; objects beyond it = "off"
  grid_cm: 5                                  # printed grid pitch
  mat_texture: mat_texture.png                # generated by export.py; same file in sim and on the print

objects:                                      # 3 shapes x 3 colours = 9 types (spec v0.2 §2); already printed
  # >>> EDIT HERE <<<  Single size parameter. (default) measure printed parts, then write the value back.
  # Grasp width is the same for all shapes: cube side = cylinder diameter = triangle ALTITUDE (flat-to-apex) = size.
  size: 0.045
  height_ratio: 1.0                           # object height = size * height_ratio (spec: height ~ width)
  fillet: 0.0025                              # 2-3 mm on all edges; triangle tips rounded with the same radius
  shapes: [cube, cylinder, triangle]          # extruded square / circle / equilateral triangle prism
  colors:                                     # matte PLA; RGB used in sim (0-255)
    red: [200, 30, 30]
    yellow: [235, 200, 20]
    blue: [30, 70, 200]
  copies_per_type: 2                          # 18 objects in total

lid:                                          # rung 3 (insert_shapes): shape-in-hole lid on ONE bin
  bin: left
  thickness: 0.003                            # plate sits on the bin rim (z = wall_height .. wall_height + thickness)
  hole_clearance: 0.010                       # (default) extra width of every hole over the object (spec §2, TODO M3);
                                              # clearance/2 per side. Spec §1.2 knob: 0.015 easy ... 0.003 hard.

bins:
  # Published layout (Junction page): three IDENTICAL orange boxes, no markings, named only by position
  # left / center / right; in a row, 5 cm gap between neighbours, near edge of the row 40 cm in front of the
  # torso (pelvis origin = waist joint). Change B here and recompute centers (formulas below).
  outer_size: [0.21, 0.21]                    # MEASURED 2026-11-13: outer width x depth of the real boxes
  wall_height: 0.06                           # (default) measure the real box
  wall_thickness: 0.003                       # (default) measure the real box
  floor_thickness: 0.003
  rgb: [230, 110, 30]                         # (default) orange, same for all boxes; take from a venue photo.
                                              # NOT an object colour: objects.colors defines the object types.
  # Centres in mat coordinates: pelvis x = 0.40 + B/2, pelvis y = 0, +-(B + 0.05); x_mat = y_pelvis + 0.45,
  # y_mat = x_pelvis - 0.14. In the pelvis frame: left (0.505, +0.26) r=0.57, center (0.505, 0) r=0.505,
  # right (0.505, -0.26) r=0.57. Side-box centres are past the ~55 cm straight-arm reach: release in the
  # near, inner part of the side boxes (check_layout). Bins are fixed + known: reachable, not necessarily seen.
  centers:
    left:   [0.71, 0.365]                     # robot's left = large mat x
    center: [0.45, 0.365]
    right:  [0.19, 0.365]

layout:
  # Region where cube centres are sampled (mat coordinates, m) and the minimum centre spacing.
  # pelvis frame: x 0.26-0.35 m forward, y +-0.17 m -> farthest corner r = 0.39 m (near edge = head-cam view limit) (comfortable reach)
  region_x: [0.28, 0.62]                     # kept inside the head camera view (test_scene checks it)
  region_y: [0.13, 0.19]                     # near limit keeps the full object inside the head image
  min_spacing: 0.08
  n_cubes: [3, 5]
  yaw_range_deg: [-45, 45]

success:
  at_rest_speed: 0.02                         # m/s; cube centre speed below this counts as at rest
  inside_margin: 0.0                          # m; cube centre must be inside the bin's INNER footprint
  off_counter_drop: 0.03                      # m; centre this far below the counter surface = knocked off

scoring:                                      # spec §3
  sort_fixed:    {"correct": 1, "wrong": -1, "counter": 0, "off": -1}
  sort_language: {"correct": 2, "wrong": -1, "counter": 0, "off": -1}
  # spec §3 rung 3: through the matching hole +3; forced into / dropped beside the lid -1; anything else 0.
  insert_shapes: {"inserted": 3, "forced": -1, "dropped": -1, "wrong_hole": 0, "counter": 0, "off": 0}
  # Not at rest at episode end counts as "counter" (0 points) unless it is inside a bin by the rule above.
